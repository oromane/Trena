name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-python/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend — tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      # P0-2 : le frontend ne lit ni n'écrit aucune table métier. Supabase n'y
      # sert qu'à l'authentification ; tout le reste passe par le moteur.
      - name: Aucun accès direct aux tables Supabase
        run: |
          if grep -rnE "\.from\(['\"\`]" app components lib --include=*.ts --include=*.tsx; then
            echo "::error::Accès direct à une table Supabase : passer par une route du moteur (P0-2)."
            exit 1
          fi
