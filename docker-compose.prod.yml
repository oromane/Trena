# Production (VPS) : aucun port public — tout le trafic entre par le tunnel
# Cloudflare. Lancer avec :
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    # Pas de ports: — joignable uniquement par cloudflared via le réseau interne
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - PERFORMANCE_ENGINE_URL=http://performance-engine:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SITE_URL=${SITE_URL}
    restart: always
    networks:
      - app-network
    depends_on:
      - performance-engine

  performance-engine:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    environment:
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - LLM_BASE_URL=http://llm:11434
      - LLM_MODEL=${LLM_MODEL:-qwen3:4b}
    restart: always
    networks:
      - app-network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    # Interface accessible uniquement depuis le VPS (tunnel SSH) ou via
    # automation.nexolab.fr si routé dans le tunnel Cloudflare (+ CF Access).
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Indispensable pour que le cron "6h00" soit bien 6h00 heure française
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: always
    networks:
      - app-network
    depends_on:
      - frontend

  # Conseiller IA local. Aucun port publié : seul le moteur l'interroge.
  # Budget VPS 8 Go / 4 vCPU : qwen3:4b quantifié ~3 Go en charge, plafonné
  # à 4 Go et 3 cœurs pour laisser respirer frontend, moteur et n8n.
  llm:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 4g
    cpus: 3
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - app-network

  # Télécharge le modèle au premier démarrage (idempotent, puis s'arrête).
  llm-init:
    image: ollama/ollama:latest
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3:4b}"]
    environment:
      - OLLAMA_HOST=http://llm:11434
    depends_on:
      llm:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

volumes:
  n8n_data:
  ollama_data:

networks:
  app-network:
    driver: bridge
